name: 构建并发布

# 只在推 v 开头的标签时触发（如 v1.0.1）。
# 也可以到 Actions 页面手动点 Run workflow 跑一次（仅构建，不建 Release）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows x64 打包
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: 安装前端依赖
        run: npm ci
        working-directory: app

      - name: 类型检查 + 前端构建
        run: npm run build
        working-directory: app

      - name: 打包并创建发行版
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "HsVerba __VERSION__"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            Windows 10 1809+ / Windows 11，x64。

            - `HsVerba_*_x64-setup.exe` —— NSIS 安装器，按用户安装，不需要管理员权限
            - `HsVerba_*_x64_*.msi` —— MSI，企业批量部署用
            - 便携版请在本页 Assets 里下载 `HsVerba.exe`

            首次运行请在「设置」里填入自己的 OpenAI 兼容接口地址与 Key（BYOK）。安装包内不含任何密钥。

      - name: 仅构建时上传产物
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: hsverba-windows-x64
          path: |
            app/src-tauri/target/release/HsVerba.exe
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
